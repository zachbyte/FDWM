name: CI

# Every push, on every branch, so a pull request shows the result for its
# latest commit.
on:
  push:
  workflow_dispatch:

jobs:
  fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install git
        run: dnf -y install git-core

      # all of the history: tests/test_palette_refactor.sh compares the
      # commit that added the palette with its parent
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # and a virtual X screen with xdotool, on which tests/test_scratchpad.sh
      # and tests/test_tag_marker.sh drive dwm
      - name: Install packages.txt, ShellCheck, runuser and Xvfb
        run: dnf -y install $(sed 's/#.*//' packages.txt) ShellCheck util-linux xorg-x11-server-Xvfb xdotool xprop

      # downloads the upstream releases pinned in patches/upstream
      - name: Rebuild dwm, st, dmenu and slock from upstream and patches/
        run: tests/patches.sh

      - name: Build dwm, st, dmenu and slock with -Werror
        run: tests/build.sh

      - name: ShellCheck every script
        run: tests/shellcheck.sh

      # install.sh and update.sh refuse to run as root, so the tests run as a
      # normal user, like on the laptop
      - name: Create a normal user
        run: useradd -m tester

      - name: Sandbox tests
        run: runuser -u tester -- env HOME=/home/tester tests/run.sh

      - name: Load the Neovim config headless
        run: runuser -u tester -- env HOME=/home/tester tests/nvim-load.sh
